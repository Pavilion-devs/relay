<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1460" viewBox="0 0 2240 1460" role="img" aria-labelledby="title desc">
<title id="title">Relay architecture</title><desc id="desc">Messages enter through Cloudflare and the EC2 host tunnel. The companion extracts reviewable drafts through Strands and Bedrock. Human-reviewed commands reach a deterministic engine. Both paths share SQLite on encrypted EBS, with durable worker jobs and S3 backups.</desc>
